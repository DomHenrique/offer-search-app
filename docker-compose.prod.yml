version: '3.8'

services:
  offer-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offer-search-prod
    restart: unless-stopped
    shm_size: 2gb
    networks:
      - rede_gridd
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SERPAPI_KEY=${SERPAPI_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.offer-search.rule=Host(`offer-search.hnperformancedigital.com.br`)"
      - "traefik.http.routers.offer-search.entrypoints=websecure"
      - "traefik.http.routers.offer-search.tls=true"
      - "traefik.http.routers.offer-search.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.offer-search.loadbalancer.server.port=5000"

networks:
  rede_gridd:
    external: true
