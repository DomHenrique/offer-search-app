{% extends "base.html" %}

{% block title %}Login - Offer Search App{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-search-dollar"></i>
            </div>
            <h2 class="auth-title">Bem-vindo de volta!</h2>
            <p class="auth-subtitle">Faça login para continuar buscando as melhores ofertas</p>
        </div>
        
        <form method="POST" class="auth-form" id="loginForm">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required>
                <label for="email">
                    <i class="fas fa-envelope me-2"></i>Email
                </label>
            </div>
            
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Senha" required>
                <label for="password">
                    <i class="fas fa-lock me-2"></i>Senha
                </label>
                <div class="password-toggle" onclick="togglePassword('password')">
                    <i class="fas fa-eye" id="password-eye"></i>
                </div>
            </div>
            
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
                <label class="form-check-label" for="remember_me">
                    Lembrar de mim
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-auth w-100 mb-3">
                <i class="fas fa-sign-in-alt me-2"></i>
                Entrar
            </button>
        </form>
        
        <div class="auth-footer">
            <p class="text-center mb-0">
                Não tem uma conta? 
                <a href="{{ url_for('auth.register') }}" class="auth-link">
                    Cadastre-se aqui
                </a>
            </p>
        </div>
    </div>
    
    <!-- Background Animation -->
    <div class="auth-bg">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="floating-shape shape-4"></div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    const submitBtn = this.querySelector('button[type="submit"]');
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Entrando...';
    submitBtn.disabled = true;
});

function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    const eye = document.getElementById(fieldId + '-eye');
    
    if (field.type === 'password') {
        field.type = 'text';
        eye.className = 'fas fa-eye-slash';
    } else {
        field.type = 'password';
        eye.className = 'fas fa-eye';
    }
}
</script>
{% endblock %}
