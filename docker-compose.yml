version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offer-search-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - PORT=5000
    volumes:
      - .:/app
      - /app/.venv
      - /app/__pycache__
    shm_size: 2gb